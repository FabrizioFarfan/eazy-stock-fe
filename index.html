    <!-- Anti-FOUC: apply dark class before first paint. Y la landing prerenderizada
         se esconde de entrada si hay sesión o si la URL no es la portada: React la
         reemplaza al montar y el usuario logueado va directo a su panel. -->
    <script>
      (function () {
        var t = localStorage.getItem('eazystock_theme')
        if (t === 'dark' || (!t && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          document.documentElement.classList.add('dark')
        }
        try {
          if (localStorage.getItem('eazystock_token') || location.pathname !== '/') {
            document.documentElement.setAttribute('data-session', '1')
          }
        } catch (e) { /* storage bloqueado */ }
      })()
    </script>
    <style>html[data-session] [data-prerender] { display: none !important; }</style>
